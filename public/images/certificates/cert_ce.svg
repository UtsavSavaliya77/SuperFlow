<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="100%" height="100%">
  <defs>
    <!-- Background Parchment Gradient -->
    <linearGradient id="ceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Outer Frame Dark Charcoal -->
    <linearGradient id="ceFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- CE Blue Gradient -->
    <linearGradient id="ceBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003399" />
      <stop offset="100%" stop-color="#001a4d" />
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="ceGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="10" y="10" width="1004" height="748" rx="16" fill="url(#ceFrame)" />
  <rect x="30" y="30" width="964" height="708" rx="8" fill="url(#ceGold)" stroke="#854d0e" stroke-width="2" />
  <rect x="42" y="42" width="940" height="684" rx="4" fill="url(#ceBg)" />

  <!-- Ornate Border -->
  <rect x="60" y="60" width="904" height="648" fill="none" stroke="#003399" stroke-width="3.5" />
  <rect x="68" y="68" width="888" height="632" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="6,3" />

  <!-- Header Section -->
  <g text-anchor="middle" font-family="'Times New Roman', Times, serif">
    <!-- EU Stars Emblem Ring -->
    <circle cx="512" cy="115" r="32" fill="url(#ceBlueGrad)" stroke="#d4af37" stroke-width="2" />
    <!-- 12 Gold Stars (Simplified visual ring) -->
    <circle cx="512" cy="92" r="3" fill="#ffcc00" />
    <circle cx="512" cy="138" r="3" fill="#ffcc00" />
    <circle cx="489" cy="115" r="3" fill="#ffcc00" />
    <circle cx="535" cy="115" r="3" fill="#ffcc00" />
    <circle cx="496" cy="99" r="3" fill="#ffcc00" />
    <circle cx="528" cy="99" r="3" fill="#ffcc00" />
    <circle cx="496" cy="131" r="3" fill="#ffcc00" />
    <circle cx="528" cy="131" r="3" fill="#ffcc00" />

    <text x="512" y="185" font-size="32" font-weight="900" fill="#003399" letter-spacing="3">EUROPEAN CONFORMITY</text>
    <text x="512" y="215" font-size="16" font-weight="bold" fill="#64748b" letter-spacing="4">DECLARATION OF CONFORMITY (CE)</text>

    <!-- Directive Ribbon Box -->
    <rect x="230" y="235" width="564" height="34" rx="6" fill="#003399" />
    <text x="512" y="258" font-size="15" font-weight="bold" fill="#ffffff" letter-spacing="2">EC MACHINERY DIRECTIVE 2006/42/EC</text>

    <!-- Certificate Number -->
    <text x="512" y="310" font-size="24" font-weight="bold" fill="#b45309" font-family="monospace" letter-spacing="1">Certificate No: CE/IND-2023/EU-4290</text>

    <!-- Body text -->
    <text x="512" y="355" font-size="18" font-style="italic" fill="#475569">This is to certify that the products manufactured by:</text>
    <text x="512" y="395" font-size="30" font-weight="900" fill="#0f172a" letter-spacing="1">ROYAL MANUFACTURE (SUPERFLOW)</text>
    <text x="512" y="430" font-size="18" font-weight="bold" fill="#334155">Padvala, Rajkot - 360024, Gujarat, India</text>

    <text x="512" y="475" font-size="16" fill="#334155">Complies with the essential health and safety requirements of European Directives:</text>
    <text x="512" y="510" font-size="22" font-weight="bold" fill="#003399">Submersible Pump Sets & Water-Filled Induction Motors</text>
    <text x="512" y="540" font-size="17" font-weight="bold" fill="#475569">Low Voltage Directive (LVD) 2014/35/EU • EMC Directive 2014/30/EU</text>
  </g>

  <!-- Left CE Stamp -->
  <g transform="translate(130, 560)">
    <circle cx="65" cy="65" r="58" fill="#ffffff" stroke="#003399" stroke-width="4" />
    <!-- CE Official Mark -->
    <text x="45" y="80" font-family="sans-serif" font-size="52" font-weight="900" fill="#003399" text-anchor="middle">C</text>
    <text x="85" y="80" font-family="sans-serif" font-size="52" font-weight="900" fill="#003399" text-anchor="middle">E</text>
    <text x="65" y="108" font-family="sans-serif" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">CONFORMITÉ</text>
  </g>

  <!-- Center Gold Certification Badge -->
  <g transform="translate(450, 560)">
    <circle cx="60" cy="60" r="52" fill="url(#ceGold)" stroke="#854d0e" stroke-width="3" />
    <circle cx="60" cy="60" r="44" fill="#ffffff" />
    <text x="60" y="50" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" fill="#003399" text-anchor="middle">OFFICIAL</text>
    <text x="60" y="68" font-family="'Times New Roman', serif" font-size="15" font-weight="900" fill="#b45309" text-anchor="middle">CE PASS</text>
    <text x="60" y="84" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">COMPLIANT</text>
  </g>

  <!-- Right Authorised Auditor Signatory -->
  <g transform="translate(740, 580)">
    <path d="M10,40 Q50,10 90,35 T150,20 T190,38" fill="none" stroke="#003399" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="50" x2="200" y2="50" stroke="#64748b" stroke-width="1.5" />
    <text x="100" y="70" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">European Compliance Auditor</text>
    <text x="100" y="90" font-family="sans-serif" font-size="12" fill="#475569" text-anchor="middle">International Safety Board</text>
  </g>
</svg>
