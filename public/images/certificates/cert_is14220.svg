<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf8f2" />
      <stop offset="50%" stop-color="#f5f1e6" />
      <stop offset="100%" stop-color="#ede6d4" />
    </linearGradient>

    <!-- Outer Wooden Frame Gradient -->
    <linearGradient id="frameWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1814" />
      <stop offset="50%" stop-color="#110d0a" />
      <stop offset="100%" stop-color="#0a0705" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#aa771c" />
    </linearGradient>

    <!-- BIS Blue Gradient -->
    <linearGradient id="bisBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3064" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- Soft Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect x="10" y="10" width="1004" height="748" rx="16" fill="url(#frameWood)" />
  <rect x="30" y="30" width="964" height="708" rx="8" fill="url(#goldGrad)" stroke="#8b6508" stroke-width="2" />
  <rect x="42" y="42" width="940" height="684" rx="4" fill="url(#bgGrad)" />

  <!-- Inner Ornate Border -->
  <rect x="60" y="60" width="904" height="648" fill="none" stroke="#1e3a8a" stroke-width="4" stroke-dasharray="8,4" />
  <rect x="68" y="68" width="888" height="632" fill="none" stroke="#aa771c" stroke-width="1.5" />

  <!-- Corner Ornaments -->
  <g fill="#aa771c">
    <path d="M72,72 L110,72 L110,76 L76,76 L76,110 L72,110 Z" />
    <path d="M952,72 L914,72 L914,76 L948,76 L948,110 L952,110 Z" />
    <path d="M72,696 L110,696 L110,692 L76,692 L76,658 L72,658 Z" />
    <path d="M952,696 L914,696 L914,692 L948,692 L948,658 L952,658 Z" />
  </g>

  <!-- Header Text -->
  <g text-anchor="middle" font-family="'Times New Roman', Times, serif">
    <text x="512" y="145" font-size="34" font-weight="900" fill="#0b3064" letter-spacing="3">BUREAU OF INDIAN STANDARDS</text>
    <text x="512" y="180" font-size="18" font-weight="bold" fill="#334155" letter-spacing="4">GOVERNMENT OF INDIA</text>
    
    <!-- Ribbon Box -->
    <rect x="220" y="205" width="584" height="36" rx="6" fill="#0b3064" />
    <text x="512" y="230" font-size="16" font-weight="bold" fill="#ffffff" letter-spacing="2">CERTIFICATE OF LICENCE TO USE THE STANDARD MARK</text>
    
    <!-- Licence Number Highlight -->
    <text x="512" y="290" font-size="28" font-weight="bold" fill="#dc2626" font-family="monospace" letter-spacing="1">Licence Number: CM/L-7600101706</text>
    
    <!-- Certification Body -->
    <text x="512" y="340" font-size="18" font-style="italic" fill="#475569">This is to certify that</text>
    <text x="512" y="380" font-size="30" font-weight="900" fill="#0f172a" letter-spacing="1">M/s ROYAL MANUFACTURE (SUPERFLOW PUMPS)</text>
    <text x="512" y="415" font-size="18" font-weight="bold" fill="#334155">Padvala, Rajkot - 360024, Gujarat, India</text>
    
    <text x="512" y="460" font-size="17" fill="#334155">has been granted licence to use the Standard Mark (ISI Mark) on the product:</text>
    <text x="512" y="500" font-size="24" font-weight="bold" fill="#0b3064">OPENWELL SUBMERSIBLE PUMP SETS</text>
    <text x="512" y="535" font-size="20" font-weight="bold" fill="#b91c1c">Conforming to IS 14220 : 1994 (With Latest Amendments)</text>
  </g>

  <!-- Left BIS Seal Graphic -->
  <g transform="translate(140, 560)">
    <circle cx="60" cy="60" r="55" fill="url(#bisBlue)" stroke="#aa771c" stroke-width="4" />
    <circle cx="60" cy="60" r="46" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,2" />
    <text x="60" y="48" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">BUREAU OF</text>
    <text x="60" y="62" font-family="'Times New Roman', serif" font-size="14" font-weight="900" fill="#fcd34d" text-anchor="middle" letter-spacing="2">INDIAN</text>
    <text x="60" y="76" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">STANDARDS</text>
    <text x="60" y="94" font-family="'Times New Roman', serif" font-size="9" fill="#93c5fd" text-anchor="middle">NEW DELHI</text>
  </g>

  <!-- Center ISI Mark Graphic -->
  <g transform="translate(450, 560)">
    <rect x="0" y="10" width="124" height="100" rx="14" fill="#ffffff" stroke="#0b3064" stroke-width="3" />
    <text x="62" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0b3064" text-anchor="middle">IS 14220</text>
    <!-- Stylized ISI logo shape -->
    <path d="M30,42 L94,42 L94,52 L70,52 L70,88 L94,88 L94,98 L30,98 L30,88 L54,88 L54,52 L30,52 Z" fill="#0b3064" />
    <text x="62" y="78" font-family="sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">ISI</text>
  </g>

  <!-- Right Official Signatory -->
  <g transform="translate(740, 580)">
    <!-- Signature Line -->
    <path d="M10,40 Q40,15 70,35 T130,25 T180,40" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="50" x2="200" y2="50" stroke="#64748b" stroke-width="1.5" />
    <text x="100" y="70" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Authorised Signatory</text>
    <text x="100" y="90" font-family="sans-serif" font-size="12" fill="#475569" text-anchor="middle">Bureau of Indian Standards</text>
  </g>

</svg>
